# Version bumps once a month, one grouped PR per ecosystem. Security fixes still come as they appear.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    groups: { pip: { patterns: ["*"] } }
