name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.f.outputs.python }}
      native: ${{ steps.f.outputs.native }}
      rust: ${{ steps.f.outputs.rust }}
      docs: ${{ steps.f.outputs.docs }}
      compat: ${{ steps.f.outputs.compat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'MANIFEST.in'
              - '.github/bandit.yaml'
              - '.github/workflows/ci.yml'
            native:
              - 'src/coil/templates/**'
              - 'tools/build_launcher.py'
              - 'scripts/build_bootloader.py'
              - 'src/coil/_launcher_stubs.py'
              - 'src/coil/bootloader.py'
              - '.github/scripts/native_compare.py'
              - '.github/workflows/ci.yml'
            rust:
              - 'native/**'
              - 'src/coil/native/**'
              - 'tools/gen_abi.py'
              - 'tools/gen_ast.py'
              - 'tools/gen_capi.py'
              - 'tools/fetch_cpython_src.py'
              - 'tools/layout_oracle.c'
              - 'tools/layout_oracle.py'
              - '.github/workflows/ci.yml'
            compat:
              - 'tests/compat/**'
              - 'tests/test_compat_matrix.py'
              - 'src/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'README.md'
              - 'docs/**'
              - '**/*.md'
              - '.github/workflows/ci.yml'

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Range
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE="$HEAD~1"; fi
          echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
      - name: Names and workflow rules
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/rules.sh "${{ steps.range.outputs.range }}"
      - name: Secrets
        run: |
          tag=v8.30.1; v=${tag#v}
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          mkdir gl && tar -xzf gl.tgz -C gl
          ./gl/gitleaks git --redact --no-banner --log-opts="${{ steps.range.outputs.range }}" .

  windows-executables:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      COIL_RUN_NATIVE_INTEGRATION: "1"
      COIL_NATIVE_RUNTIME_CACHE: build/test-runtimes
      COIL_TEST_RUNTIME_ZIP: build/test-runtimes/python-3.12.10-embed-amd64.zip
      COIL_TEST_CROSS_RUNTIME: build/test-runtimes/python-3.13.7-embed-amd64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" pywin32
      - name: Prepare real embedded runtime
        run: |
          python -c "import pathlib, urllib.request; p=pathlib.Path('build/test-runtimes'); p.mkdir(parents=True, exist_ok=True); name='python-3.12.10-embed-amd64.zip'; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.12.10/'+name, p/name)"
          python -c "import pathlib, urllib.request; p=pathlib.Path('build/test-runtimes'); name='python-3.13.7-embed-amd64.zip'; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.13.7/'+name, p/name)"
      - name: Run suite and Python 3.9–3.13 native runtime matrix
        run: python -m pytest -q --basetemp=build/pytest

  supported-build-hosts:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m coil --help
      - name: Prepare test output directory
        run: New-Item -ItemType Directory -Force build | Out-Null
      - run: python -m pytest -q tests/test_cli.py tests/test_config.py tests/test_resolver.py tests/test_scanner.py tests/test_runtime.py tests/test_inspect.py --basetemp=build/pytest

  python-audit:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Known vulnerabilities in the installed package and test extras
        run: |
          python -m pip install -e ".[test]" pip-audit==2.10.1
          python -m pip_audit --skip-editable
      - name: Bandit
        run: |
          python -m pip install bandit==1.9.4
          python -m bandit -r src/coil -c .github/bandit.yaml --severity-level low

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Checked-in stubs match the current native sources
        run: python .github/scripts/native_compare.py
      - run: python -m pip install -e ".[test]" pywin32
      - name: Rebuild the launchers from source
        run: python tools/build_launcher.py --build-dir build/launcher --output build/native/_launcher_stubs.py
      - name: Rebuild the portable bootloader from source
        run: python scripts/build_bootloader.py
      # MSVC output is not byte-identical across toolchain versions, so the fresh builds are tested instead of diffed.
      - name: Install the fresh stubs in this checkout
        run: |
          Copy-Item build/native/_launcher_stubs.py src/coil/_launcher_stubs.py
          python scripts/build_bootloader.py --update
      - name: Prepare real embedded runtime
        run: |
          python -c "import pathlib, urllib.request; p=pathlib.Path('build/test-runtimes'); p.mkdir(parents=True, exist_ok=True); name='python-3.12.10-embed-amd64.zip'; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.12.10/'+name, p/name)"
          python -c "import pathlib, urllib.request; p=pathlib.Path('build/test-runtimes'); name='python-3.13.7-embed-amd64.zip'; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.13.7/'+name, p/name)"
      - name: Launcher and portable tests against the fresh stubs
        env:
          COIL_RUN_NATIVE_INTEGRATION: "1"
          COIL_NATIVE_RUNTIME_CACHE: build/test-runtimes
          COIL_TEST_RUNTIME_ZIP: build/test-runtimes/python-3.12.10-embed-amd64.zip
          COIL_TEST_CROSS_RUNTIME: build/test-runtimes/python-3.13.7-embed-amd64.zip
        run: python -m pytest -q tests/test_launcher.py tests/test_launcher_integration.py tests/test_portable_integration.py tests/test_subsystem_integration.py tests/test_windows_subsystem.py --basetemp=build/pytest

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is 26.04, which has no 3.12.10 build in
        # actions/python-versions; the AST generator check needs that version.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Generated AST types are current
        run: python tools/gen_ast.py --check
      - name: Generated ABI constants are current
        run: python tools/gen_abi.py --check
      - name: MSVC environment for the CPython header layout oracle
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: coil-rt-abi constants match the pinned CPython headers
        if: runner.os == 'Windows'
        run: python tools/layout_oracle.py --check
      - name: Export lists match the pinned 3.12.10 runtime
        if: runner.os == 'Windows'
        run: |
          python -m pip install pefile==2024.8.26
          python tools/gen_capi.py --check
      - name: Install the pinned Rust toolchain
        working-directory: native
        run: rustup show
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            native/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - run: cargo fmt --all --check
        working-directory: native
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: native
      - run: cargo test --workspace
        working-directory: native
      - name: coil-rt builds python312.dll and exports the ABI hash
        if: runner.os == 'Windows'
        working-directory: native
        run: |
          cargo build --release -p coil-rt
          if (-Not (Test-Path target/release/python312.dll)) {
            throw "cargo did not produce target/release/python312.dll"
          }
          $exports = dumpbin /EXPORTS target/release/python312.dll
          if (-Not ($exports -match 'coil_rt_abi_sha256')) {
            throw "python312.dll does not export coil_rt_abi_sha256"
          }

  front-diff:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # ubuntu-latest moved to 26.04, which has no prebuilt Python 3.12.10.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Cache the extracted CPython standard library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.coil/cache/stdlib-src
          key: stdlib-src-3.12.10
      - name: Install the pinned Rust toolchain
        working-directory: native
        run: rustup show
      - name: Fetch the CPython 3.12.10 standard library
        run: python tools/fetch_cpython_src.py
      - name: Token-level differential over the standard library
        working-directory: native
        run: python ../tools/front_diff.py --tokens "$(python ../tools/fetch_cpython_src.py --print-root)/Lib"

  compat:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.compat == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      COIL_RUN_COMPAT: "1"
      COIL_RUN_NATIVE_INTEGRATION: "1"
      COIL_TEST_RUNTIME_ZIP: build/test-runtimes/python-3.12.10-embed-amd64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/compat/*/requirements.txt
      - run: python -m pip install -e ".[test]"
      - name: Prepare real embedded runtime
        run: |
          python -c "import pathlib, urllib.request; p=pathlib.Path('build/test-runtimes'); p.mkdir(parents=True, exist_ok=True); name='python-3.12.10-embed-amd64.zip'; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.12.10/'+name, p/name)"
      - name: Build and run the package compatibility matrix
        run: python -m pytest -q tests/test_compat_matrix.py --basetemp=build/pytest-compat

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  ci-ok:
    needs: [changes, rules, windows-executables, supported-build-hosts, python-audit, native, rust, front-diff, compat, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        run: |
          [ "${{ contains(needs.*.result, 'failure') }}" = false ] && [ "${{ contains(needs.*.result, 'cancelled') }}" = false ]
