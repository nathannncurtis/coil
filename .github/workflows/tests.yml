name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  windows-executables:
    runs-on: windows-latest
    env:
      COIL_RUN_NATIVE_INTEGRATION: "1"
      COIL_NATIVE_RUNTIME_CACHE: build/test-runtimes
      COIL_TEST_RUNTIME_ZIP: build/test-runtimes/python-3.12.10-embed-amd64.zip
      COIL_TEST_CROSS_RUNTIME: build/test-runtimes/python-3.13.7-embed-amd64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" pywin32
      - name: Prepare real embedded runtime
        run: |
          python -c "import pathlib, urllib.request; p=pathlib.Path('build/test-runtimes'); p.mkdir(parents=True, exist_ok=True); name='python-3.12.10-embed-amd64.zip'; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.12.10/'+name, p/name)"
          python -c "import pathlib, urllib.request; p=pathlib.Path('build/test-runtimes'); name='python-3.13.7-embed-amd64.zip'; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.13.7/'+name, p/name)"
      - name: Run suite and Python 3.9–3.13 native runtime matrix
        run: python -m pytest -q --basetemp=build/pytest

  supported-build-hosts:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m coil --help
      - run: python -m pytest -q tests/test_cli.py tests/test_config.py tests/test_resolver.py tests/test_scanner.py tests/test_runtime.py tests/test_inspect.py --basetemp=build/pytest
