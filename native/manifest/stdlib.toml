# The stdlib manifest (spec sections 10.6 and 11.1): how a compiled build
# provides every module of the embeddable CPython 3.12.10 runtime. `coilc`
# consults this table while growing the closed-world module set.
#
# kind is one of:
#   compiled      pure Python, compiled from the pinned Lib/ tree
#   shim          provided by a Python file under native/shims/
#   native        provided by the Rust runtime in python312.dll; a leaf
#   pyd           CPython's own extension from the embeddable zip; a leaf
#   unsupported   has no compiled-build implementation; statically importing
#                 one is a build error naming the module and the reason
#
# The 67 built-ins are the pinned 3.12.10 sources' PC/config.c
# _PyImport_Inittab; the .pyd list is the embeddable zip's contents; coilc's
# tests assert the built-in names are all covered.

# Provided by Rust in coil-rt (spec section 10.6).
[_ast]
kind = "native"

[_codecs]
kind = "native"

[_codecs_cn]
kind = "native"

[_codecs_hk]
kind = "native"

[_codecs_iso2022]
kind = "native"

[_codecs_jp]
kind = "native"

[_codecs_kr]
kind = "native"

[_codecs_tw]
kind = "native"

