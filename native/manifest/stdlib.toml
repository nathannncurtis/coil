kind = "native"

[_locale]
kind = "native"

[_multibytecodec]
kind = "native"

[_random]
kind = "native"

[_signal]
kind = "native"

[_sre]
kind = "native"

[_string]
kind = "native"

[_struct]
kind = "native"

[_thread]
kind = "native"

[_tracemalloc]
kind = "native"

[_typing]
kind = "native"

[_weakref]
kind = "native"

[_winapi]
kind = "native"

[array]
kind = "native"

[atexit]
kind = "native"

[audioop]
kind = "native"

[binascii]
kind = "native"

[builtins]
kind = "native"

[cmath]
