[sys]
kind = "native"

[time]
kind = "native"

[winreg]
kind = "native"

[zlib]
kind = "native"

# Pure Python standing in for built-in modules (spec section 10.6): the
# stdlib's own fallbacks and shims. Each names a file under native/shims/
# (which may import the compiled fallback below it).
[_abc]
kind = "shim"

[_bisect]
kind = "shim"

[_csv]
kind = "shim"

[_datetime]
kind = "shim"

[_functools]
kind = "shim"

[_heapq]
kind = "shim"

[_io]
kind = "shim"

[_json]
kind = "shim"

[_opcode]
kind = "shim"

[_operator]
kind = "shim"

[_pickle]
kind = "shim"

[_stat]
kind = "shim"

[_statistics]
kind = "shim"

[_tokenize]
kind = "shim"

[_warnings]
kind = "shim"

# The stdlib's own pure-Python fallbacks, compiled from the pinned Lib/ tree.
[_py_abc]
kind = "compiled"

[_pydatetime]
kind = "compiled"

[_pyio]
kind = "compiled"

# CPython's own extension modules, loaded through the C API layer
# (spec section 10.6).
[_asyncio]
kind = "pyd"

[_bz2]
