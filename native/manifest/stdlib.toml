# No compiled-build implementation (spec section 10.6).
[_blake2]
kind = "unsupported"
reason = "hashlib uses _hashlib.pyd and tolerates the absence of the built-in hash modules"

[_lsprof]
kind = "unsupported"
reason = "cProfile needs profiling, which compiled builds do not support (sys.setprofile is unsupported)"

[_md5]
kind = "unsupported"
reason = "hashlib uses _hashlib.pyd and tolerates the absence of the built-in hash modules"

[_sha1]
kind = "unsupported"
reason = "hashlib uses _hashlib.pyd and tolerates the absence of the built-in hash modules"

[_sha2]
kind = "unsupported"
reason = "hashlib uses _hashlib.pyd and tolerates the absence of the built-in hash modules"

[_sha3]
kind = "unsupported"
reason = "hashlib uses _hashlib.pyd and tolerates the absence of the built-in hash modules"

[_symtable]
kind = "unsupported"
reason = "introspection of CPython's own symtable; Coil's symtable is not CPython's"

[_xxinterpchannels]
kind = "unsupported"
reason = "sub-interpreter channels are not implemented by the coil runtime"

[_xxsubinterpreters]
kind = "unsupported"
reason = "sub-interpreters are not implemented by the coil runtime"

[xxsubtype]
kind = "unsupported"
reason = "CPython's test-only example type module"
