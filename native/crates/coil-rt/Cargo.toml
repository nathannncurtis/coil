[package]
name = "coil-rt"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coil-rt-abi = { path = "../coil-rt-abi" }
coil-capi-sys = { path = "../coil-capi-sys" }

[lib]
# The cdylib is the runtime DLL named for the impersonated ABI (section 10.1).
name = "python312"
crate-type = ["cdylib", "rlib"]

[features]
# Heap debugging of spec section 9.3: poisoning freed blocks' bodies,
# quarantining freed counted-regime objects for one collection, checking
# `heap_refs` underflow, and recomputing `heap_refs` from a heap walk at
# every collection.
debug-heap = []