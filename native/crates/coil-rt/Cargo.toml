[package]
name = "coil-rt"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coil-rt-abi = { path = "../coil-rt-abi" }
coil-capi-sys = { path = "../coil-capi-sys" }
# The SRE matching engine behind `_sre` (spec section 10.6): the
# vendored RustPython 0.4.3 under ../sre-engine.
sre-engine = { path = "../sre-engine" }

[dev-dependencies]
cc = "=1.10.0"

[lib]
# The cdylib is the runtime DLL named for the impersonated ABI (section 10.1).
name = "python312"
crate-type = ["cdylib", "rlib"]

[features]
# Heap debugging of spec section 9.3: poisoning freed blocks' bodies,
# quarantining freed counted-regime objects for one collection, checking
# `heap_refs` underflow, and recomputing `heap_refs` from a heap walk at
# every collection.
debug-heap = []