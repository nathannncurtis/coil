[package]
name = "coil-rt"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coil-rt-abi = { path = "../coil-rt-abi" }
coil-capi-sys = { path = "../coil-capi-sys" }

[lib]
# The cdylib is the runtime DLL named for the impersonated ABI (section 10.1).
name = "python312"
crate-type = ["cdylib", "rlib"]